syntax = "proto3";
package notifications.v1;
option go_package = "github.com/irhinandrej399-jpg/binance-price-alerts/internal/gen/notifications/v1;notificationsv1";

// Every registered mandatory consumer must be queried by the cleaner. One
// response proves only this exact consumer, never completeness of the registry.
service NotificationsProgress {
  rpc ReadProgress(ReadProgressRequest) returns (ReadProgressResponse);
}
message ReadProgressRequest {
  string generation = 1; // externally expected SQL bootstrap generation
  string consumer_id = 2; // stable logical intake, independent of group member
  string cluster_id = 3;
  bytes topic_id = 4; // Kafka topic UUID, exactly 16 bytes
  string topic = 5;
  int32 partition = 6;
}
message ReadProgressResponse {
  string generation = 1; // externally expected SQL bootstrap generation
  string consumer_id = 2;
  string cluster_id = 3;
  bytes topic_id = 4;
  string topic = 5;
  int32 partition = 6;
  optional int64 next_offset = 7; // only SQL-confirmed; absent on any failure
}
