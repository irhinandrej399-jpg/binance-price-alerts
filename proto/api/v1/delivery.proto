syntax = "proto3";
package api.v1;
option go_package = "github.com/irhinandrej399-jpg/binance-price-alerts/internal/gen/api/v1;apiv1";

service Delivery {
  rpc RequestDelivery(RequestDeliveryRequest) returns (RequestDeliveryResponse);
}
// Only matcher service credentials authorize this command. No candidate price,
// pair, threshold or user session is accepted; API reads canonical data itself.
message RequestDeliveryRequest {
  string owner_id = 1;
  string subscription_id = 2;
  int64 expected_version = 3;
}
message Workflow {
  string trigger_id = 1;
  int64 version = 2;
}
message RequestDeliveryResponse {
  string subscription_id = 1;
  int64 subscription_version = 2;
  string state = 3;
  Workflow workflow = 4; // Existing identity, including after terminal state.
}
