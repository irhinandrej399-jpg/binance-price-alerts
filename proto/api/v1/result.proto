syntax = "proto3";
package api.v1;
option go_package = "github.com/irhinandrej399-jpg/binance-price-alerts/internal/gen/api/v1;apiv1";

service DeliveryResults {
  rpc SaveDeliveryResult(SaveDeliveryResultRequest) returns (SaveDeliveryResultResponse);
}
// Notifications only. Repeat this exact observation after timeout; never resend
// Telegram because this RPC failed. No caller lease/fence/recipient is accepted.
message SaveDeliveryResultRequest {
  string owner_id = 1;
  string subscription_id = 2;
  string workflow_id = 3;
  string attempt_id = 4;
  string outcome = 5; // succeeded, retryable, uncertain, blocked.
  int64 message_id = 6; // Positive only for succeeded; zero otherwise.
  string block_reason = 7; // Only blocked: channel_unavailable, attempts_exhausted, permanent_failure.
}
// Acknowledges durable observation and returns CURRENT canonical state, also on
// replay. Cancellation is never revived; first successful receipt remains canonical.
message SaveDeliveryResultResponse {
  string subscription_id = 1;
  int64 subscription_version = 2;
  string state = 3;
  string workflow_id = 4;
  string block_reason = 5;
  int64 blocked_binding_version = 6;
}
