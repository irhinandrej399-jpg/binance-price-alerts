# Public profile: only Caddy publishes host ports. Separate API ingress network.
services:
  api:
    ports: !reset []
    networks:
      default: {}
      ingress:
        ipv4_address: ${INGRESS_API_IP:?}
  ingress:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    user: "${RUN_UID:?}:${RUN_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports: ["${INGRESS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443", "${INGRESS_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:?}/ingress:/run/ingress:ro
      - ${DATA_DIR:?}/caddy:/data
    networks:
      ingress:
        ipv4_address: ${INGRESS_PROXY_IP:?}
        aliases: ["${PUBLIC_DOMAIN:?}"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  ingress:
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:?}
